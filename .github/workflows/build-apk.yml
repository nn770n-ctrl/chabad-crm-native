name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # אופציונלי: מפתח חתימה קבוע (נדרש כדי שעדכונים יותקנו מעל גרסאות קודמות).
      # מגדירים Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: |
          set +e
          ./gradlew --no-daemon --console=plain --stacktrace assembleRelease 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # מציג את שגיאת הבנייה כ-annotation (נראה בעמוד הריצה גם בלי לפתוח את הלוג)
            MSG=$(grep -m1 -A25 -E "^FAILURE:|What went wrong" build.log | head -c 3500)
            echo "::error title=Gradle failure::${MSG//$'\n'/%0A}"
            JERR=$(grep -E "error:|^e: |AAPT: error|Execution failed" build.log | head -15 | head -c 3500)
            [ -n "$JERR" ] && echo "::error title=Compile errors::${JERR//$'\n'/%0A}"
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: chabad-crm-apk
          path: app/build/outputs/apk/release/*.apk
